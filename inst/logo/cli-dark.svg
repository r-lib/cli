        <text x="122" y="67" fill="#93a1a1" text-anchor="middle">│</text>
        <text x="140" y="67" fill="#859900" text-anchor="middle">❯</text>
        <text x="5" y="85" fill="#93a1a1" text-anchor="middle">✖</text>
        <text x="23" y="85" fill="#93a1a1" text-anchor="middle">●</text>
        <text x="41" y="85" fill="#93a1a1" text-anchor="middle">─</text>
        <text x="59" y="85" fill="#93a1a1" text-anchor="middle">│</text>
