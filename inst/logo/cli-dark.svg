    <radialGradient id="vignette" cx="45%" cy="50%" r="60%">
      <stop offset="55%" stop-color="#00161c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00161c" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="fadeg" cx="43%" cy="50%" r="50%">
      <stop offset="0%" stop-color="black"/>
      <stop offset="45%" stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </radialGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="462">
      <rect x="0" y="0" width="400" height="462" fill="white"/>
      <ellipse cx="160" cy="232" rx="140" ry="70" fill="url(#fadeg)"/>
    </mask>
  </defs>

  <style>
    .bg-text { font-family: Menlo, Consolas, monospace; font-size: 12px; white-space: pre; }
    .prompt-text { font-family: Menlo, Consolas, monospace; font-size: 72px; }
    #cursor { transform-box: fill-box; animation: cursor-anim 10.45s linear infinite; }
    #c-c { animation: c-reveal 10.45s linear infinite; }
    #c-l { animation: l-reveal 10.45s linear infinite; }
    #c-i { animation: i-reveal 10.45s linear infinite; }

    @keyframes cursor-anim {
      0.0%    { transform: translateX(0px);   opacity: 1; }
      1.4354% { transform: translateX(0px);   opacity: 1; }
      1.4364% { transform: translateX(45px);  opacity: 1; }
      2.8708% { transform: translateX(45px);  opacity: 1; }
      2.8718% { transform: translateX(90px);  opacity: 1; }
      4.3062% { transform: translateX(90px);  opacity: 1; }
      4.3072% { transform: translateX(135px); opacity: 1; }
      9.0909% { transform: translateX(135px); opacity: 0; }
      13.8756%{ transform: translateX(135px); opacity: 1; }
      18.6603%{ transform: translateX(135px); opacity: 0; }
      23.445% { transform: translateX(135px); opacity: 1; }
      28.2297%{ transform: translateX(135px); opacity: 0; }
      33.0144%{ transform: translateX(135px); opacity: 1; }
      37.799% { transform: translateX(135px); opacity: 0; }
      42.5837%{ transform: translateX(135px); opacity: 1; }
      47.3684%{ transform: translateX(135px); opacity: 0; }
      52.1531%{ transform: translateX(135px); opacity: 1; }
      56.9378%{ transform: translateX(135px); opacity: 0; }
      61.7225%{ transform: translateX(135px); opacity: 1; }
      66.5072%{ transform: translateX(135px); opacity: 0; }
      71.2919%{ transform: translateX(135px); opacity: 1; }
      76.0766%{ transform: translateX(135px); opacity: 0; }
      80.8612%{ transform: translateX(135px); opacity: 1; }
      85.6459%{ transform: translateX(135px); opacity: 0; }
      90.4306%{ transform: translateX(135px); opacity: 1; }
      95.2153%{ transform: translateX(135px); opacity: 0; }
      100.0%  { transform: translateX(135px); opacity: 1; }
    }
    @keyframes c-reveal {
      0%      { opacity: 0; }
      1.4353% { opacity: 0; }
      1.4355% { opacity: 1; }
      100%    { opacity: 1; }
    }
    @keyframes l-reveal {
      0%      { opacity: 0; }
      2.8707% { opacity: 0; }
      2.8709% { opacity: 1; }
      100%    { opacity: 1; }
    }
    @keyframes i-reveal {
      0%      { opacity: 0; }
      4.3061% { opacity: 0; }
      4.3063% { opacity: 1; }
      100%    { opacity: 1; }
    }
  </style>

  <!-- hex border -->
  <polygon points="200,4 396,119 396,343 200,458 4,343 4,119"
           fill="#f5f5f0" />

  <g clip-path="url(#hex)">
    <rect x="0" y="0" width="400" height="462" fill="#002b36"/>
    <g class="bg-text" xml:space="preserve" mask="url(#fade)">
      <rect x="0" y="0" width="400" height="462" fill="url(#glyphs)" opacity="0.18"/>
    </g>
    <rect x="0" y="0" width="400" height="462" fill="url(#vignette)"/>

    <!-- typing animation, centered in the hex (shifted left) -->
    <text class="prompt-text" x="70" y="252" fill="#859900">❯</text>
    <text id="c-c" class="prompt-text" x="125" y="258" fill="#93a1a1">c</text>
    <text id="c-l" class="prompt-text" x="170" y="258" fill="#93a1a1">l</text>
    <text id="c-i" class="prompt-text" x="215" y="258" fill="#93a1a1">i</text>

    <rect id="cursor" x="139" y="198" width="28" height="64" fill="#859900"/>
  </g>
</svg>
