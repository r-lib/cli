  <g clip-path="url(#hex)">
    <rect x="0" y="0" width="400" height="462" fill="#002b36"/>
    <g class="bg-text" xml:space="preserve" mask="url(#fade)">
      <rect x="0" y="0" width="400" height="462" fill="url(#glyphs)" opacity="0.18"/>
    </g>
    <rect x="0" y="0" width="400" height="462" fill="url(#vignette)"/>

    <!-- prompt, centered in the hex (shifted left) -->
